# Stack Portainer : tire l'image construite par GitHub Actions sur GHCR.
# Variables optionnelles dans Portainer : TAFL_PORT (défaut 8080), TAFL_TAG (défaut latest).
services:
  tafl:
    image: ghcr.io/williamloree/tafl:${TAFL_TAG:-latest}
    container_name: tafl
    ports:
      - "${TAFL_PORT:-8080}:80"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
